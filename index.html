<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>두두 프롬프터 · Dudu Teleprompter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(17, 24, 39, 0.88);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    /* Camera background */
    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 0;
      display: none;
    }

    #cameraVideo.mirror-cam {
      transform: scaleX(-1);
    }

    /* Dimmer overlay for readability */
    #dimmer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
      pointer-events: none;
      transition: background 0.2s;
    }

    /* Eye-line guide */
    #eyeGuide {
      position: fixed;
      top: 22%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.65), transparent);
      z-index: 2;
      pointer-events: none;
    }
    #eyeGuide::before {
      content: attr(data-label);
      position: absolute;
      right: 14px;
      top: -20px;
      font-size: 11px;
      color: rgba(56, 189, 248, 0.85);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* Prompter stage */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow-y: auto;
      padding: 20vh 24px 70vh 24px;
      scroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      cursor: pointer;
    }

    #scriptDisplay {
      max-width: 820px;
      margin: 0 auto;
      font-size: 34px;
      line-height: 1.55;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: break-word;
      transition: transform 0.2s;
      user-select: none;
    }

    #scriptDisplay.flip-x {
      transform: scaleX(-1);
    }
    #scriptDisplay.flip-y {
      transform: scaleY(-1);
    }
    #scriptDisplay.flip-x.flip-y {
      transform: scale(-1, -1);
    }

    /* Top bar */
    #topBar {
      position: fixed;
      top: env(safe-area-inset-top, 12px);
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 7px 10px 8px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .top-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #brandName {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      display: none;
      flex: 0 0 10px;
      animation: pulse 1s infinite;
    }
    .rec-dot.active {
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* Language switch */
    .lang-switch {
      display: flex;
      gap: 2px;
      flex: 0 0 auto;
      padding: 2px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .lang-switch button {
      padding: 3px 7px;
      margin: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.3;
      min-width: 0;
    }
    .lang-switch button[aria-pressed="true"] {
      background: var(--accent);
      color: #082f49;
    }

    .top-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
    }
    button.primary {
      background: var(--accent);
      color: #082f49;
      border-color: transparent;
    }
    button.danger {
      background: var(--danger);
      color: #fff;
      border-color: transparent;
    }
    button.active-toggle {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent);
      color: #bae6fd;
    }

    /* Top action buttons: even 2-up grid on phones so nothing overflows */
    .top-actions button {
      width: 100%;
      min-width: 0;
      padding: 7px 6px;
      font-size: 12px;
      gap: 4px;
    }

    /* Bottom control bar */
    #bottomBar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 8px);
      left: 10px;
      right: 10px;
      z-index: 10;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 820px;
      margin: 0 auto;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .controls-row.bottom-buttons {
      gap: 6px;
    }
    .btn-cluster {
      display: flex;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .btn-cluster.secondary {
      justify-content: flex-end;
    }
    .btn-cluster button {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px 8px;
      font-size: 12.5px;
    }

    .sliders-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .slider-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .slider-group input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--accent);
    }
    .slider-val {
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
    }

    /* Countdown overlay */
    #countdownOverlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      font-size: 96px;
      font-weight: 800;
      color: var(--accent);
    }

    /* Script Editor Modal */
    #editorModal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    }
    #editorModal.open {
      display: flex;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }
    #scriptInput {
      flex: 1;
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 128px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--border);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    /* Wider screens: back to a roomy single-row top bar */
    @media (min-width: 640px) {
      #topBar {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
      }
      .top-line {
        flex: 1 1 auto;
      }
      .top-actions {
        display: flex;
        flex: 0 1 auto;
        flex-wrap: nowrap;
      }
      .top-actions button {
        width: auto;
        padding: 8px 12px;
        font-size: 13px;
      }
      .lang-switch {
        order: 3;
      }
      .slider-head {
        font-size: 12px;
      }
      #toast {
        top: 72px;
        white-space: normal;
      }
    }

    @media (max-width: 420px) {
      #eyeGuide {
        top: 26%;
      }
      #scriptDisplay {
        font-size: 30px;
      }
      .btn-cluster button {
        font-size: 12px;
        padding: 8px 6px;
      }
    }
  </style>
</head>
<body>

  <video id="cameraVideo" autoplay playsinline muted></video>
  <div id="dimmer"></div>
  <div id="eyeGuide" data-label="▲ 시선 기준선 (렌즈 방향)"></div>

  <div id="topBar">
    <div class="top-line">
      <div class="brand">
        <span class="rec-dot" id="recDot"></span>
        <span id="brandName" data-i18n="brand">🎬 두두 프롬프터</span>
        <span id="recTimer" style="font-size:12px; color:#fca5a5; display:none;">00:00</span>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">KO</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnEditor" data-i18n="script">📝 대본</button>
      <button id="btnCamera" data-i18n="camera">📷 카메라</button>
      <button id="btnFlipCam" data-i18n="flipCam" style="display:none;">🔄 전환</button>
      <button id="btnMirror" data-i18n="mirror">🪞 반전</button>
      <button id="btnHideUI" data-i18n="hideUI">👁️ 숨김</button>
    </div>
  </div>

  <div id="stage" title="화면을 탭하면 재생/일시정지 됩니다">
    <div id="scriptDisplay"></div>
  </div>

  <div id="bottomBar">
    <div class="sliders-row">
      <div class="slider-group">
        <div class="slider-head">
          <span data-i18n="speed">속도</span>
          <span class="slider-val" id="speedVal">3.5</span>
        </div>
        <input type="range" id="speedRange" min="1" max="15" step="0.5" value="3.5" />
      </div>
      <div class="slider-group">
        <div class="slider-head">
          <span data-i18n="size">크기</span>
          <span class="slider-val" id="sizeVal">34px</span>
        </div>
        <input type="range" id="sizeRange" min="20" max="64" step="2" value="34" />
      </div>
      <div class="slider-group">
        <div class="slider-head">
          <span data-i18n="dim">배경</span>
          <span class="slider-val" id="dimVal">55%</span>
        </div>
        <input type="range" id="dimRange" min="0" max="90" step="5" value="55" />
      </div>
    </div>

    <div class="controls-row bottom-buttons">
      <div class="btn-cluster">
        <button id="btnReset" data-i18n="reset">⏮️ 처음</button>
        <button id="btnPlay" class="primary" data-i18n="play">▶️ 시작</button>
      </div>
      <div class="btn-cluster secondary">
        <button id="btnRecord" style="display:none;" data-i18n="record">⏺️ 녹화</button>
        <a id="downloadLink" style="display:none; text-decoration:none; flex:1 1 auto;">
          <button class="primary" style="width:100%;" data-i18n="save">⬇️ 저장</button>
        </a>
      </div>
    </div>
  </div>

  <div id="countdownOverlay">3</div>

  <div id="editorModal">
    <div class="modal-header">
      <h2 data-i18n="editorTitle">📝 대본 입력 / 수정</h2>
      <button id="btnCloseEditor" data-i18n="close">닫기</button>
    </div>
    <textarea id="scriptInput" data-i18n-placeholder="editorPlaceholder" placeholder="여기에 대본을 붙여넣으세요..."></textarea>
    <div class="modal-footer">
      <button id="btnClearScript" data-i18n="clear">🗑️ 비우기</button>
      <button id="btnSaveScript" class="primary" data-i18n="apply">✅ 적용하기</button>
    </div>
  </div>

    };

    const stage = document.getElementById("stage");
    const scriptDisplay = document.getElementById("scriptDisplay");
    const scriptInput = document.getElementById("scriptInput");
    const editorModal = document.getElementById("editorModal");
    const cameraVideo = document.getElementById("cameraVideo");
    const dimmer = document.getElementById("dimmer");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const toastEl = document.getElementById("toast");
    const eyeGuide = document.getElementById("eyeGuide");
    const topBar = document.getElementById("topBar");
    const bottomBar = document.getElementById("bottomBar");

    const btnPlay = document.getElementById("btnPlay");
    const btnReset = document.getElementById("btnReset");
    const btnEditor = document.getElementById("btnEditor");
    const btnCloseEditor = document.getElementById("btnCloseEditor");
    const btnClearScript = document.getElementById("btnClearScript");
    const btnSaveScript = document.getElementById("btnSaveScript");
    const btnCamera = document.getElementById("btnCamera");
    const btnFlipCam = document.getElementById("btnFlipCam");
    const btnMirror = document.getElementById("btnMirror");
    const btnHideUI = document.getElementById("btnHideUI");
    const btnRecord = document.getElementById("btnRecord");
    const downloadLink = document.getElementById("downloadLink");
    const recDot = document.getElementById("recDot");
    const recTimer = document.getElementById("recTimer");
    const langSwitch = document.getElementById("langSwitch");

    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const sizeRange = document.getElementById("sizeRange");
    const sizeVal = document.getElementById("sizeVal");
    const dimRange = document.getElementById("dimRange");
    const dimVal = document.getElementById("dimVal");

    let isPlaying = false;
    let rafId = null;
    let lastTime = 0;
    let scrollAcc = 0;

    let cameraStream = null;
    let facingMode = "user";
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recInterval = null;
    let recSeconds = 0;
    let uiHidden = false;

    /* ---------- language state ---------- */
    function detectLang() {
      let fromUrl = null;
      try {
        fromUrl = new URLSearchParams(window.location.search).get("lang");
      } catch (e) { /* ignore */ }
      if (fromUrl) {
        fromUrl = fromUrl.toLowerCase().slice(0, 2);
        if (LANGS.includes(fromUrl)) return { lang: fromUrl, fromUrl: true };
      }
      const saved = (localStorage.getItem(LANG_KEY) || "").toLowerCase();
      if (LANGS.includes(saved)) return { lang: saved, fromUrl: false };
      return { lang: "ko", fromUrl: false };
    }

    const initial = detectLang();
    let currentLang = initial.lang;
    if (initial.fromUrl) localStorage.setItem(LANG_KEY, currentLang);

    const hasCustomScript = () => {
      const v = localStorage.getItem(SCRIPT_KEY);
      return v !== null && v.trim() !== "";
    };

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.ko[key] || "";
    }

    function refreshDynamicLabels() {
      btnPlay.textContent = isPlaying ? t("pause") : t("play");
      btnCamera.textContent = cameraStream ? t("cameraOff") : t("camera");
      btnRecord.textContent = isRecording ? t("stop") : t("record");
    }

    function applyLang(lang, opts) {
      const options = opts || {};
      if (!LANGS.includes(lang)) lang = "ko";
      currentLang = lang;

      document.documentElement.lang = lang;
      document.title = t("pageTitle");

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        const val = t(key);
        if (val) el.textContent = val;
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const val = t(el.getAttribute("data-i18n-placeholder"));
        if (val) el.setAttribute("placeholder", val);
      });

      eyeGuide.setAttribute("data-label", t("eyeGuide"));
      stage.setAttribute("title", t("stageTitle"));

      langSwitch.querySelectorAll("button").forEach((b) => {
        b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
      });

      // Switch the example script only while the user has never saved their own
      if (!hasCustomScript()) {
        const next = DEFAULT_SCRIPTS[lang];
        const changed = scriptDisplay.textContent !== next;
        scriptDisplay.textContent = next;
        if (changed && options.resetScroll !== false) stage.scrollTop = 0;
        if (editorModal.classList.contains("open")) scriptInput.value = next;
      }

      refreshDynamicLabels();
      if (options.persist !== false) localStorage.setItem(LANG_KEY, lang);
    }

    langSwitch.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      const lang = btn.getAttribute("data-lang");
      if (lang === currentLang) return;
      const wasPlaying = isPlaying;
      if (wasPlaying) stopScroll();
      applyLang(lang);
      showToast(t("langLabel"));
    });

    /* ---------- initial script ---------- */
    const savedScript = localStorage.getItem(SCRIPT_KEY);
    scriptDisplay.textContent = (savedScript && savedScript.trim()) ? savedScript : DEFAULT_SCRIPTS[currentLang];
    scriptInput.value = scriptDisplay.textContent;
    applyLang(currentLang, { persist: false, resetScroll: false });

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => { toastEl.style.display = "none"; }, 3000);
    }

    // Scroll engine
    function step(timestamp) {
      if (!isPlaying) return;
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      const speed = parseFloat(speedRange.value); // px-scale factor
      const pxPerSec = speed * 18;
      scrollAcc += pxPerSec * dt;
      if (scrollAcc >= 1) {
        const move = Math.floor(scrollAcc);
        stage.scrollTop += move;
        scrollAcc -= move;
      }

      if (stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 4) {
        stopScroll();
        showToast(t("toastEnd"));
        return;
      }
      rafId = requestAnimationFrame(step);
    }

    function startScroll(withCountdown = false) {
      if (withCountdown) {
        let cnt = 3;
        countdownOverlay.textContent = cnt;
        countdownOverlay.style.display = "flex";
        const timer = setInterval(() => {
          cnt -= 1;
          if (cnt > 0) {
            countdownOverlay.textContent = cnt;
          } else {
            clearInterval(timer);
            countdownOverlay.style.display = "none";
            isPlaying = true;
            lastTime = 0;
            refreshDynamicLabels();
            rafId = requestAnimationFrame(step);
          }
        }, 700);
      } else {
        isPlaying = true;
        lastTime = 0;
        refreshDynamicLabels();
        rafId = requestAnimationFrame(step);
      }
    }

    function stopScroll() {
      isPlaying = false;
      if (rafId) cancelAnimationFrame(rafId);
      refreshDynamicLabels();
    }

    btnPlay.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isPlaying) stopScroll();
      else startScroll(stage.scrollTop < 10);
    });

    btnReset.addEventListener("click", (e) => {
      e.stopPropagation();
      stopScroll();
      stage.scrollTop = 0;
    });

    // Tap stage to toggle play/pause (or restore UI)
    stage.addEventListener("click", () => {
      if (uiHidden) {
        uiHidden = false;
        topBar.style.display = "flex";
        bottomBar.style.display = "flex";
        return;
      }
      if (isPlaying) stopScroll();
      else startScroll(false);
    });

    // Sliders
    speedRange.addEventListener("input", () => {
      speedVal.textContent = speedRange.value;
    });
    sizeRange.addEventListener("input", () => {
      const sz = sizeRange.value;
      sizeVal.textContent = sz + "px";
      scriptDisplay.style.fontSize = sz + "px";
    });
    dimRange.addEventListener("input", () => {
      const d = dimRange.value;
      dimVal.textContent = d + "%";
      dimmer.style.background = `rgba(0, 0, 0, ${d / 100})`;
    });

    // Mirror toggle
    btnMirror.addEventListener("click", () => {
      scriptDisplay.classList.toggle("flip-x");
      btnMirror.classList.toggle("active-toggle");
      showToast(scriptDisplay.classList.contains("flip-x") ? t("toastMirrorOn") : t("toastMirrorOff"));
    });

    // Hide UI
    btnHideUI.addEventListener("click", () => {
      uiHidden = true;
      topBar.style.display = "none";
      bottomBar.style.display = "none";
      showToast(t("toastUIShown"));
    });

    // Editor
    btnEditor.addEventListener("click", () => {
      stopScroll();
      scriptInput.value = scriptDisplay.textContent;
      editorModal.classList.add("open");
    });
    btnCloseEditor.addEventListener("click", () => {
      editorModal.classList.remove("open");
    });
    btnClearScript.addEventListener("click", () => {
      scriptInput.value = "";
      scriptInput.focus();
    });
    btnSaveScript.addEventListener("click", () => {
      const txt = scriptInput.value.trim();
      scriptDisplay.textContent = txt || DEFAULT_SCRIPTS[currentLang];
      localStorage.setItem(SCRIPT_KEY, scriptDisplay.textContent);
      stage.scrollTop = 0;
      editorModal.classList.remove("open");
      showToast(t("toastApplied"));
    });

    // Camera
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast(t("toastNoHttps"));
        return;
      }
      try {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.style.display = "block";
        cameraVideo.classList.toggle("mirror-cam", facingMode === "user");
        btnCamera.classList.add("active-toggle");
        btnFlipCam.style.display = "inline-flex";
        btnRecord.style.display = "inline-flex";
        refreshDynamicLabels();
        showToast(facingMode === "user" ? t("toastCamFront") : t("toastCamBack"));
      } catch (err) {
        showToast(t("toastCamError") + err.message);
      }
    }

    function stopCamera() {
      if (isRecording) stopRecording();
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      cameraVideo.style.display = "none";
      btnCamera.classList.remove("active-toggle");
      btnFlipCam.style.display = "none";
      btnRecord.style.display = "none";
      refreshDynamicLabels();
    }

    btnCamera.addEventListener("click", () => {
      if (cameraStream) stopCamera();
      else startCamera();
    });

    btnFlipCam.addEventListener("click", () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    // Recording
    function startRecording() {
      if (!cameraStream) return;
      recordedChunks = [];
      downloadLink.style.display = "none";

      let options = {};
      if (MediaRecorder.isTypeSupported("video/mp4")) {
        options = { mimeType: "video/mp4" };
      } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
        options = { mimeType: "video/webm;codecs=vp9" };
      }

      try {
        mediaRecorder = new MediaRecorder(cameraStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(cameraStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const mime = mediaRecorder.mimeType || "video/mp4";
        const ext = mime.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(recordedChunks, { type: mime });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.download = `prompter_${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.${ext}`;
        downloadLink.style.display = "block";
        showToast(t("toastRecDone"));
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.classList.add("danger");
      recDot.classList.add("active");
      recTimer.style.display = "inline";
      recSeconds = 0;
      recTimer.textContent = "00:00";
      refreshDynamicLabels();
      recInterval = setInterval(() => {
        recSeconds++;
        const m = String(Math.floor(recSeconds / 60)).padStart(2, "0");
        const s = String(recSeconds % 60).padStart(2, "0");
        recTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      isRecording = false;
      clearInterval(recInterval);
      btnRecord.classList.remove("danger");
      recDot.classList.remove("active");
      recTimer.style.display = "none";
      refreshDynamicLabels();
    }

    btnRecord.addEventListener("click", () => {
      if (isRecording) stopRecording();
      else startRecording();
    });
  </script>
</body>
</html>
