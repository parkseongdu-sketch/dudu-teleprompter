<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>두두 프롬프터 · Dudu Teleprompter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(17, 24, 39, 0.88);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    /* Camera background */
    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 0;
      display: none;
    }

    #cameraVideo.mirror-cam {
      transform: scaleX(-1);
    }

    /* Dimmer overlay for readability */
    #dimmer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
      pointer-events: none;
      transition: background 0.2s;
    }

    /* Eye-line guide */
    #eyeGuide {
      position: fixed;
      top: 22%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.65), transparent);
      z-index: 2;
      pointer-events: none;
    }
    #eyeGuide::before {
      content: "▲ 시선 기준선 (렌즈 방향)";
      position: absolute;
      right: 14px;
      top: -20px;
      font-size: 11px;
      color: rgba(56, 189, 248, 0.85);
      letter-spacing: 0.02em;
    }

    /* Prompter stage */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow-y: auto;
      padding: 20vh 24px 70vh 24px;
      scroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      cursor: pointer;
    }

    #scriptDisplay {
      max-width: 820px;
      margin: 0 auto;
      font-size: 34px;
      line-height: 1.55;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      white-space: pre-wrap;
      word-break: keep-all;
      transition: transform 0.2s;
      user-select: none;
    }

    #scriptDisplay.flip-x {
      transform: scaleX(-1);
    }
    #scriptDisplay.flip-y {
      transform: scaleY(-1);
    }
    #scriptDisplay.flip-x.flip-y {
      transform: scale(-1, -1);
    }

    /* Top bar */
    #topBar {
      position: fixed;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      display: none;
      animation: pulse 1s infinite;
    }
    .rec-dot.active {
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
    }
    button.primary {
      background: var(--accent);
      color: #082f49;
      border-color: transparent;
    }
    button.danger {
      background: var(--danger);
      color: #fff;
      border-color: transparent;
    }
    button.active-toggle {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent);
      color: #bae6fd;
    }

    /* Bottom control bar */
    #bottomBar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 8px);
      left: 12px;
      right: 12px;
      z-index: 10;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 820px;
      margin: 0 auto;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 150px;
      font-size: 12px;
      color: var(--muted);
    }
    .slider-group input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .slider-val {
      min-width: 34px;
      text-align: right;
      color: var(--text);
      font-weight: 600;
    }

    /* Countdown overlay */
    #countdownOverlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      font-size: 96px;
      font-weight: 800;
      color: var(--accent);
    }

    /* Script Editor Modal */
    #editorModal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    }
    #editorModal.open {
      display: flex;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }
    #scriptInput {
      flex: 1;
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--border);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <video id="cameraVideo" autoplay playsinline muted></video>
  <div id="dimmer"></div>
  <div id="eyeGuide"></div>

  <div id="topBar">
    <div class="brand">
      <span class="rec-dot" id="recDot"></span>
      <span>🎬 두두 프롬프터</span>
      <span id="recTimer" style="font-size:12px; color:#fca5a5; display:none;">00:00</span>
    </div>
    <div class="top-actions">
      <button id="btnEditor">📝 대본</button>
      <button id="btnCamera">📷 카메라</button>
      <button id="btnFlipCam" style="display:none;">🔄 전환</button>
      <button id="btnMirror">🪞 반전</button>
      <button id="btnHideUI">👁️ 숨김</button>
    </div>
  </div>

  <div id="stage" title="화면을 탭하면 재생/일시정지 됩니다">
    <div id="scriptDisplay"></div>
  </div>

  <div id="bottomBar">
    <div class="controls-row">
      <div class="slider-group">
        <span>속도</span>
        <input type="range" id="speedRange" min="1" max="15" step="0.5" value="3.5" />
        <span class="slider-val" id="speedVal">3.5</span>
      </div>
      <div class="slider-group">
        <span>크기</span>
        <input type="range" id="sizeRange" min="20" max="64" step="2" value="34" />
        <span class="slider-val" id="sizeVal">34px</span>
      </div>
      <div class="slider-group">
        <span>배경</span>
        <input type="range" id="dimRange" min="0" max="90" step="5" value="55" />
        <span class="slider-val" id="dimVal">55%</span>
      </div>
    </div>

    <div class="controls-row">
      <div style="display:flex; gap:8px;">
        <button id="btnReset">⏮️ 처음</button>
        <button id="btnPlay" class="primary">▶️ 시작</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="btnRecord" style="display:none;">⏺️ 녹화</button>
        <a id="downloadLink" style="display:none; text-decoration:none;">
          <button class="primary">⬇️ 저장</button>
        </a>
      </div>
    </div>
  </div>

  <div id="countdownOverlay">3</div>

  <div id="editorModal">
    <div class="modal-header">
      <h2>📝 대본 입력 / 수정</h2>
      <button id="btnCloseEditor">닫기</button>
    </div>
    <textarea id="scriptInput" placeholder="여기에 대본을 붙여넣으세요..."></textarea>
    <div class="modal-footer">
      <button id="btnClearScript">🗑️ 비우기</button>
      <button id="btnSaveScript" class="primary">✅ 적용하기</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const DEFAULT_SCRIPT = `안녕하세요, 여러분! 두두와 레샤 채널에 오신 걸 환영합니다.

오늘은 15년 차 리포터 남편과 러시아 아내 레샤의 솔직한 일상을 담아봤어요.

팁 하나!
화면 위쪽 파란 선 근처에 시선을 두고 읽으시면, 카메라 렌즈를 자연스럽게 바라보는 것처럼 보입니다.

오른쪽 위 '대본' 버튼을 눌러 원하시는 대본을 붙여넣고,
아래 슬라이더로 속도와 글자 크기를 편하게 맞춰 보세요!

화면을 한번 탭하면 언제든 일시정지·재개가 가능합니다.`;

    const stage = document.getElementById("stage");
    const scriptDisplay = document.getElementById("scriptDisplay");
    const scriptInput = document.getElementById("scriptInput");
    const editorModal = document.getElementById("editorModal");
    const cameraVideo = document.getElementById("cameraVideo");
    const dimmer = document.getElementById("dimmer");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const toastEl = document.getElementById("toast");

    const btnPlay = document.getElementById("btnPlay");
    const btnReset = document.getElementById("btnReset");
    const btnEditor = document.getElementById("btnEditor");
    const btnCloseEditor = document.getElementById("btnCloseEditor");
    const btnClearScript = document.getElementById("btnClearScript");
    const btnSaveScript = document.getElementById("btnSaveScript");
    const btnCamera = document.getElementById("btnCamera");
    const btnFlipCam = document.getElementById("btnFlipCam");
    const btnMirror = document.getElementById("btnMirror");
    const btnHideUI = document.getElementById("btnHideUI");
    const btnRecord = document.getElementById("btnRecord");
    const downloadLink = document.getElementById("downloadLink");
    const recDot = document.getElementById("recDot");
    const recTimer = document.getElementById("recTimer");

    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const sizeRange = document.getElementById("sizeRange");
    const sizeVal = document.getElementById("sizeVal");
    const dimRange = document.getElementById("dimRange");
    const dimVal = document.getElementById("dimVal");

    let isPlaying = false;
    let rafId = null;
    let lastTime = 0;
    let scrollAcc = 0;

    let cameraStream = null;
    let facingMode = "user";
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recInterval = null;
    let recSeconds = 0;
    let uiHidden = false;

    // Load saved script & settings
    const savedScript = localStorage.getItem("dudu_prompter_script");
    scriptDisplay.textContent = savedScript || DEFAULT_SCRIPT;
    scriptInput.value = scriptDisplay.textContent;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => { toastEl.style.display = "none"; }, 3000);
    }

    // Scroll engine
    function step(timestamp) {
      if (!isPlaying) return;
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      const speed = parseFloat(speedRange.value); // px-scale factor
      const pxPerSec = speed * 18;
      scrollAcc += pxPerSec * dt;
      if (scrollAcc >= 1) {
        const move = Math.floor(scrollAcc);
        stage.scrollTop += move;
        scrollAcc -= move;
      }

      if (stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 4) {
        stopScroll();
        showToast("대본 끝에 도달했습니다.");
        return;
      }
      rafId = requestAnimationFrame(step);
    }

    function startScroll(withCountdown = false) {
      if (withCountdown) {
        let cnt = 3;
        countdownOverlay.textContent = cnt;
        countdownOverlay.style.display = "flex";
        const timer = setInterval(() => {
          cnt -= 1;
          if (cnt > 0) {
            countdownOverlay.textContent = cnt;
          } else {
            clearInterval(timer);
            countdownOverlay.style.display = "none";
            isPlaying = true;
            lastTime = 0;
            btnPlay.textContent = "⏸️ 정지";
            rafId = requestAnimationFrame(step);
          }
        }, 700);
      } else {
        isPlaying = true;
        lastTime = 0;
        btnPlay.textContent = "⏸️ 정지";
        rafId = requestAnimationFrame(step);
      }
    }

    function stopScroll() {
      isPlaying = false;
      if (rafId) cancelAnimationFrame(rafId);
      btnPlay.textContent = "▶️ 시작";
    }

    btnPlay.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isPlaying) stopScroll();
      else startScroll(stage.scrollTop < 10);
    });

    btnReset.addEventListener("click", (e) => {
      e.stopPropagation();
      stopScroll();
      stage.scrollTop = 0;
    });

    // Tap stage to toggle play/pause (or restore UI)
    stage.addEventListener("click", () => {
      if (uiHidden) {
        uiHidden = false;
        document.getElementById("topBar").style.display = "flex";
        document.getElementById("bottomBar").style.display = "flex";
        return;
      }
      if (isPlaying) stopScroll();
      else startScroll(false);
    });

    // Sliders
    speedRange.addEventListener("input", () => {
      speedVal.textContent = speedRange.value;
    });
    sizeRange.addEventListener("input", () => {
      const sz = sizeRange.value;
      sizeVal.textContent = sz + "px";
      scriptDisplay.style.fontSize = sz + "px";
    });
    dimRange.addEventListener("input", () => {
      const d = dimRange.value;
      dimVal.textContent = d + "%";
      dimmer.style.background = `rgba(0, 0, 0, ${d / 100})`;
    });

    // Mirror toggle
    btnMirror.addEventListener("click", () => {
      scriptDisplay.classList.toggle("flip-x");
      btnMirror.classList.toggle("active-toggle");
      showToast(scriptDisplay.classList.contains("flip-x") ? "좌우 반전 켜짐" : "좌우 반전 꺼짐");
    });

    // Hide UI
    btnHideUI.addEventListener("click", () => {
      uiHidden = true;
      document.getElementById("topBar").style.display = "none";
      document.getElementById("bottomBar").style.display = "none";
      showToast("화면 아무 곳이나 탭하면 메뉴가 다시 나와요");
    });

    // Editor
    btnEditor.addEventListener("click", () => {
      stopScroll();
      scriptInput.value = scriptDisplay.textContent;
      editorModal.classList.add("open");
    });
    btnCloseEditor.addEventListener("click", () => {
      editorModal.classList.remove("open");
    });
    btnClearScript.addEventListener("click", () => {
      scriptInput.value = "";
      scriptInput.focus();
    });
    btnSaveScript.addEventListener("click", () => {
      const txt = scriptInput.value.trim();
      scriptDisplay.textContent = txt || DEFAULT_SCRIPT;
      localStorage.setItem("dudu_prompter_script", scriptDisplay.textContent);
      stage.scrollTop = 0;
      editorModal.classList.remove("open");
      showToast("대본이 적용되었습니다.");
    });

    // Camera
    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast("이 환경에서는 카메라를 열 수 없어요 (HTTPS 주소 필요)");
        return;
      }
      try {
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.style.display = "block";
        cameraVideo.classList.toggle("mirror-cam", facingMode === "user");
        btnCamera.classList.add("active-toggle");
        btnCamera.textContent = "📷 끄기";
        btnFlipCam.style.display = "inline-flex";
        btnRecord.style.display = "inline-flex";
        showToast(facingMode === "user" ? "전면 카메라 켜짐" : "후면 카메라 켜짐");
      } catch (err) {
        showToast("카메라 권한을 확인해 주세요: " + err.message);
      }
    }

    function stopCamera() {
      if (isRecording) stopRecording();
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      cameraVideo.style.display = "none";
      btnCamera.classList.remove("active-toggle");
      btnCamera.textContent = "📷 카메라";
      btnFlipCam.style.display = "none";
      btnRecord.style.display = "none";
    }

    btnCamera.addEventListener("click", () => {
      if (cameraStream) stopCamera();
      else startCamera();
    });

    btnFlipCam.addEventListener("click", () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    // Recording
    function startRecording() {
      if (!cameraStream) return;
      recordedChunks = [];
      downloadLink.style.display = "none";

      let options = {};
      if (MediaRecorder.isTypeSupported("video/mp4")) {
        options = { mimeType: "video/mp4" };
      } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
        options = { mimeType: "video/webm;codecs=vp9" };
      }

      try {
        mediaRecorder = new MediaRecorder(cameraStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(cameraStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const mime = mediaRecorder.mimeType || "video/mp4";
        const ext = mime.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(recordedChunks, { type: mime });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.download = `prompter_${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.${ext}`;
        downloadLink.style.display = "inline-block";
        showToast("녹화 완료! '저장' 버튼을 눌러 내려받으세요.");
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.textContent = "⏹️ 정지";
      btnRecord.classList.add("danger");
      recDot.classList.add("active");
      recTimer.style.display = "inline";
      recSeconds = 0;
      recTimer.textContent = "00:00";
      recInterval = setInterval(() => {
        recSeconds++;
        const m = String(Math.floor(recSeconds / 60)).padStart(2, "0");
        const s = String(recSeconds % 60).padStart(2, "0");
        recTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      isRecording = false;
      clearInterval(recInterval);
      btnRecord.textContent = "⏺️ 녹화";
      btnRecord.classList.remove("danger");
      recDot.classList.remove("active");
      recTimer.style.display = "none";
    }

    btnRecord.addEventListener("click", () => {
      if (isRecording) stopRecording();
      else startRecording();
    });
  </script>
</body>
</html>
